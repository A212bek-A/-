<!DOCTYPE html>
<html lang="ru" data-th="dark"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Карточки</title>
<style>
:root{--bg:#0e1226;--card:#171b38;--line:#2b3060;--ink:#eef0ff;--mute:#a3a8d0;--acc:#9b8cff;--go:#5ee0c0;--gof:#0e1226;--hero:linear-gradient(135deg,#2a2f66,#1a1e40);--herob:#363c80}
:root[data-th=light]{--bg:#f2f3fb;--card:#fff;--line:#d9dcf1;--ink:#14173a;--mute:#585d8c;--acc:#5a45e0;--go:#0b8a6c;--gof:#fff;--hero:linear-gradient(135deg,#e4e7ff,#d3d8ff);--herob:#bcc3f5}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{overflow-x:hidden;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:20px 18px 48px;max-width:520px;margin:auto}
h1{font-size:clamp(24px,8vw,32px);line-height:1.08;margin:4px 0 8px;font-weight:800;letter-spacing:-.5px;overflow-wrap:anywhere;hyphens:auto}
h2{font-size:19px;margin:0 0 12px;font-weight:800}
p{margin:0 0 12px}
.mute{color:var(--mute);font-size:14px}
button{font:inherit;font-weight:700;border:0;border-radius:14px;padding:14px 16px;background:var(--go);color:var(--gof)}
button.g{background:transparent;color:var(--ink);border:1px solid var(--line)}
button.w{width:100%}
button:disabled{opacity:.4}
input,textarea{width:100%;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:10px}
input:focus,textarea:focus{outline:2px solid var(--acc);border-color:transparent}
.dots{width:44px;height:44px;border-radius:50%;padding:0;display:grid;place-items:center;font-size:24px;line-height:1;background:transparent;color:var(--ink);border:1px solid var(--line)}
.anch{position:relative}
.bd{position:fixed;inset:0;z-index:6}
.pop{position:absolute;right:0;top:52px;width:250px;z-index:7;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:4px 14px;box-shadow:0 12px 32px rgba(0,0,0,.4)}
.pop .it:first-child{border-top:0}
.it{display:flex;align-items:center;gap:14px;width:100%;padding:11px 2px;font-size:15px;background:none;color:var(--ink);border:0;border-top:1px solid var(--line);border-radius:0;text-align:left;font-weight:600}
.it span{flex:none;font-size:18px;width:22px;text-align:center;display:grid;place-items:center}
.it small{margin-left:auto;color:var(--mute);font-weight:500;font-size:13px;white-space:nowrap;flex:none;padding-left:14px}
.it{white-space:nowrap;gap:10px}
.bar0{position:relative;display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.hero{background:var(--hero);border:1px solid var(--herob);border-radius:24px;padding:22px;margin-bottom:26px}
.hero .n{font-size:58px;font-weight:800;line-height:1}
.hero .mute{margin:4px 0 16px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:26px 22px;padding:0 14px 14px 0;margin-bottom:18px}
.stack{position:relative;min-width:0}
.stack i{position:absolute;inset:0;border-radius:18px;background:var(--c)}
.stack i:nth-child(1){transform:translate(14px,14px) rotate(3deg);filter:brightness(.6)}
.stack i:nth-child(2){transform:translate(7px,7px) rotate(1.5deg);filter:brightness(.8)}
.top{position:relative;width:100%;min-height:172px;border-radius:18px;padding:15px;background:var(--c);color:#fff;border:1px solid rgba(255,255,255,.25);text-align:left;display:flex;flex-direction:column;justify-content:space-between;font-weight:500}
.top{min-width:0}
.top b{font-size:clamp(14px,4.3vw,19px);line-height:1.15;font-weight:800;display:block;overflow-wrap:anywhere;hyphens:auto;-webkit-hyphens:auto}
.top small{font-size:13px;opacity:.92;display:block;margin-top:6px}
.tag{white-space:nowrap;display:inline-block;background:#5ee0c0;color:#0e1226;border-radius:8px;padding:2px 9px;font-weight:800;font-size:13px}
.pg{height:5px;border-radius:3px;background:rgba(255,255,255,.28);margin-top:10px}
.pg u{display:block;height:100%;background:#fff;border-radius:3px}
.new{min-width:0;position:relative;min-height:172px;border-radius:18px;border:2px dashed var(--line);background:transparent;color:var(--mute);display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;font-weight:600}
.new i{font-style:normal;font-size:36px;line-height:1;color:var(--ink)}
.box{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:14px}
.row{display:flex;gap:10px}.row>*{flex:1}
.head{border-radius:24px;padding:18px;color:#fff;background:var(--c);margin-bottom:22px}
.head h1{margin-top:12px}
.head .bk{background:rgba(255,255,255,.22);color:#fff;padding:8px 14px}
.stats{display:flex;gap:8px;margin:14px 0}
.stats div{flex:1;background:rgba(255,255,255,.18);border-radius:12px;padding:8px 10px;font-size:13px}
.stats b{display:block;font-size:22px}
.start{background:#5ee0c0;color:#0e1226}
.cd{border-top:1px solid var(--line)}
.cd:first-of-type{border-top:0}
.cd summary{list-style:none;display:flex;justify-content:space-between;align-items:center;padding:13px 0;cursor:pointer}
.cd summary::-webkit-details-marker{display:none}
.cd summary::after{content:"\203A";font-size:24px;color:var(--mute);transition:transform .2s}
.cd[open] summary::after{transform:rotate(90deg)}
.cd .ar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:0 0 13px;color:var(--acc);font-weight:700}
.sbar{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.sbar .x{padding:8px 13px}
.bar{flex:1;height:8px;background:var(--line);border-radius:4px}
.bar i{display:block;height:100%;background:var(--c);border-radius:4px;transition:width .3s}
.scene{position:relative;z-index:0;height:340px;margin-bottom:38px}
.card{position:relative;height:100%;transform-style:preserve-3d;transition:transform .5s}
.card.f{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:26px;padding:26px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-size:27px;font-weight:800;line-height:1.2;word-break:break-word}
.face .zh{font-size:34px;line-height:1.15}.face .py{font-size:17px;font-weight:700;color:var(--ink);opacity:.82;margin:2px 0 12px}
@supports (color:color-mix(in srgb,red 50%,blue)){.face .py{color:color-mix(in srgb,var(--acc) 42%,var(--ink));opacity:1}}
.face small{font-size:13px;font-weight:700;color:var(--mute);margin-bottom:14px}
.face em{position:absolute;bottom:18px;font-size:13px;font-weight:500;font-style:normal;color:var(--mute)}
.front{background:var(--card);border:1px solid var(--line);border-top:12px solid var(--c)}
.back{background:var(--c);color:#fff;transform:rotateY(180deg)}
.back small{color:rgba(255,255,255,.8)}
.ans{display:flex;gap:12px;opacity:0;pointer-events:none;transition:opacity .25s}
.ans.show{opacity:1;pointer-events:auto}
.ans button{flex:1;padding:18px;font-size:18px}
.no{background:transparent;color:var(--ink);border:2px solid var(--line)}
.done{text-align:center;padding:40px 10px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:700;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90%;text-align:center}
#toast.on{opacity:1}

/* animations */
@keyframes rise{from{opacity:0;transform:translateY(22px) scale(.97)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes cardIn{from{opacity:0;transform:translateX(60px) rotate(4deg) scale(.95)}to{opacity:1;transform:none}}
@keyframes fly{to{opacity:0;transform:translateX(130%) rotate(12deg)}}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-14px) rotate(-2deg)}40%{transform:translateX(12px) rotate(2deg)}60%{transform:translateX(-8px)}80%{transform:translateX(6px)}}
@keyframes popIn{from{opacity:0;transform:scale(.85) translateY(-8px)}to{opacity:1;transform:none}}
@keyframes fall{to{transform:translateY(108vh) rotate(560deg)}}
@keyframes drift{0%{background-position:0 0}100%{background-position:100% 100%}}
@keyframes bump{0%{transform:scale(.6)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
#app.enter>*:not(.grid){animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
#app.enter>*:nth-child(2){animation-delay:.06s}
#app.enter>*:nth-child(3){animation-delay:.12s}
#app.enter>*:nth-child(5){animation-delay:.2s}
#app.enter .grid>*{animation:rise .55s cubic-bezier(.2,.8,.2,1) both}
#app.enter .grid>*:nth-child(1){animation-delay:.15s}
#app.enter .grid>*:nth-child(2){animation-delay:.22s}
#app.enter .grid>*:nth-child(3){animation-delay:.29s}
#app.enter .grid>*:nth-child(4){animation-delay:.36s}
#app.enter .grid>*:nth-child(5){animation-delay:.43s}
#app.enter .grid>*:nth-child(n+6){animation-delay:.5s}
#app.enter .pg u{transform-origin:left;animation:grow .9s .45s cubic-bezier(.2,.8,.2,1) both}
.hero{background-size:220% 220%;animation:drift 9s ease-in-out infinite alternate}
.stack i{transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.top{transition:transform .22s cubic-bezier(.2,.8,.2,1)}
.stack:active .top{transform:translateY(-5px) scale(1.03)}
.stack:active i:nth-child(1){transform:translate(22px,20px) rotate(8deg)}
.stack:active i:nth-child(2){transform:translate(11px,10px) rotate(4deg)}
button{transition:transform .15s,opacity .2s,background-color .3s}
button:active:not(:disabled){transform:scale(.96)}
.new:active{transform:scale(.96)}
.pop{transform-origin:top right;animation:popIn .2s cubic-bezier(.2,.8,.2,1)}
.bd{animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.cd[open] .ar{animation:rise .3s both}
.done h1{animation:bump .6s both}
.conf{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:4}
.conf s{position:absolute;top:-16px;width:9px;height:15px;border-radius:2px;animation:fall 2s linear forwards}
body,.box,.hero,input,textarea,.pop,.face,.top{transition:background-color .35s,color .35s,border-color .35s}
.top{transition:transform .22s cubic-bezier(.2,.8,.2,1),background-color .35s}
#toast{transform:translateX(-50%) translateY(16px);transition:opacity .25s,transform .25s}
#toast.on{transform:translateX(-50%) translateY(0)}

@keyframes cardIn2{0%{opacity:0;transform:translateY(54px) scale(.86)}55%{opacity:1}100%{opacity:1;transform:none}}
@keyframes flyR{0%{opacity:1;transform:none}100%{opacity:0;transform:translateX(125%) translateY(-20px) rotate(14deg)}}
@keyframes flyL{0%{opacity:1;transform:none}100%{opacity:0;transform:translateX(-125%) translateY(-20px) rotate(-14deg)}}
.scene:before,.scene:after{content:"";position:absolute;left:0;right:0;top:0;bottom:0;border-radius:26px;background:var(--card);border:1px solid var(--line);z-index:0}
.scene:before{transform:translateY(26px) scale(.9);opacity:.45}
.scene:after{transform:translateY(13px) scale(.95);opacity:.75}
.mover{position:relative;z-index:1;height:100%;perspective:1100px;animation:cardIn2 .7s cubic-bezier(.22,1,.36,1) .08s both}
.mover.ok{animation:flyR .46s cubic-bezier(.55,0,.8,.4) forwards}
.mover.no{animation:flyL .46s cubic-bezier(.55,0,.8,.4) forwards}
.mover.ok .back{box-shadow:0 0 0 4px #5ee0c0,0 0 44px rgba(94,224,192,.7)}
.mover.no .back{box-shadow:0 0 0 4px #ff7a7a,0 0 44px rgba(255,122,122,.6)}
.lv{display:inline-block;font-size:12px;font-weight:800;background:rgba(255,255,255,.25);border-radius:6px;padding:1px 7px;vertical-align:middle}

:root{--flc:rgba(255,255,255,.14);--flb:rgba(255,255,255,.32);--ringbg:#232851}
:root[data-th=light]{--ringbg:#dae0ff}
:root[data-th=light]{--flc:rgba(90,69,224,.12);--flb:rgba(90,69,224,.32)}
.hero{position:relative;overflow:hidden}
.hero>*:not(.fl){position:relative;z-index:1}
.fl{position:absolute;inset:0;pointer-events:none;z-index:0}
.fl i{position:absolute;bottom:-70px;width:30px;height:42px;border-radius:7px;background:var(--flc);border:1.5px solid var(--flb);animation:floatUp 9s linear infinite}
.fl i:after{content:"";position:absolute;left:5px;right:5px;top:9px;height:3px;border-radius:2px;background:var(--flb);box-shadow:0 7px 0 var(--flb),0 14px 0 var(--flb)}
.fl i:nth-child(1){left:4%;--r:-20deg;animation-duration:8s;animation-delay:-1s}
.fl i:nth-child(2){left:17%;--r:14deg;width:24px;height:34px;animation-duration:11s;animation-delay:-6s}
.fl i:nth-child(3){left:31%;--r:-8deg;animation-duration:9s;animation-delay:-3s}
.fl i:nth-child(4){left:46%;--r:22deg;width:36px;height:50px;animation-duration:12s;animation-delay:-9s}
.fl i:nth-child(5){left:60%;--r:-16deg;width:26px;height:36px;animation-duration:8.5s;animation-delay:-5s}
.fl i:nth-child(6){left:73%;--r:10deg;animation-duration:10s;animation-delay:-2s}
.fl i:nth-child(7){left:85%;--r:-24deg;width:34px;height:46px;animation-duration:11.5s;animation-delay:-7.5s}
.fl i:nth-child(8){left:93%;--r:18deg;width:22px;height:30px;animation-duration:9.5s;animation-delay:-4s}
@keyframes floatUp{0%{transform:translateY(0) rotate(var(--r)) scale(.8);opacity:0}12%{opacity:1}80%{opacity:1}100%{transform:translateY(-300px) rotate(calc(var(--r) * -1.6)) scale(1.15);opacity:0}}
.crs{display:flex;gap:8px;margin:0 0 14px}.crs button{flex:1}
.hero .n{display:inline-block;transform-origin:left center;animation:beat 3.2s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1);text-shadow:0 0 0 rgba(94,224,192,0)}50%{transform:scale(1.07);text-shadow:0 0 26px rgba(94,224,192,.55)}}

.pop{width:max-content;min-width:min(212px,66vw);max-width:calc(100vw - 36px);top:48px;padding:2px 12px;border-radius:18px}
.warn{background:var(--card);border:1.5px solid #ff7a59;border-radius:18px;padding:14px;margin-bottom:16px;display:flex;flex-direction:column;gap:10px}
.streakbox{text-align:center;padding:24px 10px;border-radius:24px;background:var(--hero);border:1px solid var(--herob);margin-bottom:16px}
.flame svg{display:block}.flame{line-height:1;display:inline-block;transform-origin:50% 90%;animation:flame 1.6s ease-in-out infinite}
@keyframes flame{0%,100%{transform:scale(1) rotate(-4deg)}50%{transform:scale(1.15) rotate(4deg)}}
.sn{font-size:56px;font-weight:800;line-height:1.1}
.hearts{display:flex;gap:12px;font-size:36px;line-height:1}
.hrt{filter:grayscale(1);opacity:.3;transition:filter .3s,opacity .3s}
.hrt.on{filter:none;opacity:1;animation:bump .6s both}
.chart{display:flex;align-items:flex-end;gap:8px;height:130px;margin:8px 0 12px}
.chart div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:12px;color:var(--mute);gap:6px}
.chart i{display:block;width:100%;border-radius:6px 6px 2px 2px;background:var(--acc);transform-origin:bottom;animation:growY .8s cubic-bezier(.2,.8,.2,1) both}
@keyframes growY{from{transform:scaleY(0)}}
.ringw{display:flex;justify-content:center;margin:8px 0}
.stp{display:flex;align-items:center;justify-content:space-between;gap:12px}
.stp b{font-size:40px;font-weight:800}
.stp button{min-width:76px}
.swrow{display:flex;justify-content:space-between;align-items:center;gap:12px;font-weight:700}
.swrow input{-webkit-appearance:none;appearance:none;flex:none;width:52px;height:30px;margin:0;border-radius:15px;background:var(--line);border:1.5px solid var(--herob);position:relative;cursor:pointer;transition:background .25s,border-color .25s;outline:none;-webkit-tap-highlight-color:transparent}
.swrow input::after{content:"";position:absolute;top:2px;left:2px;width:23px;height:23px;border-radius:50%;background:var(--mute);box-shadow:0 1px 4px rgba(0,0,0,.35);transition:transform .25s cubic-bezier(.2,.8,.2,1),background .25s}
.swrow input:checked{background:var(--go);border-color:var(--go)}
.swrow input:checked::after{transform:translateX(22px);background:#fff}
.swrow input:focus-visible{box-shadow:0 0 0 3px var(--acc)}

.spk{position:absolute;top:12px;right:12px;width:40px;height:40px;padding:0;border-radius:50%;background:var(--hero);border:1px solid var(--herob);display:grid;place-items:center;z-index:2}
.qcard{position:relative}
/* quiz */
.qcard{flex:1;display:flex;flex-direction:column;justify-content:center;text-align:center;gap:14px;padding:8px 4px 20px}
.qcard small{font-size:13px;font-weight:700;color:var(--mute)}
.qs{font-size:clamp(24px,7.4vw,32px);font-weight:800;line-height:1.5;overflow-wrap:anywhere}
.blank{display:inline-block;min-width:92px;height:1em;border-bottom:4px solid var(--acc);margin:0 6px;vertical-align:-4px;border-radius:2px;text-align:center}
.blank.ok,.blank.bad{height:auto;min-width:0;padding:0 4px;vertical-align:baseline}
.blank.ok{color:var(--go);border-color:var(--go)}.blank.bad{color:#ff7a7a;border-color:#ff7a7a}
.opts{margin-top:auto;display:grid;grid-auto-flow:column;grid-template-rows:repeat(2,auto);grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.qwrap{animation:cardIn2 .7s cubic-bezier(.22,1,.36,1) .05s both}
.qwrap.ok{animation:flyR .46s cubic-bezier(.55,0,.8,.4) forwards}
.qscene{position:relative;margin-bottom:38px}
.qscene:before,.qscene:after{content:"";position:absolute;inset:0;border-radius:26px;background:var(--card);border:1px solid var(--line);z-index:0}
.qscene:before{transform:translateY(26px) scale(.9);opacity:.45}
.qscene:after{transform:translateY(13px) scale(.95);opacity:.75}
.qwrap{position:relative;z-index:1;display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-top:12px solid var(--c);border-radius:26px;padding:14px 12px 12px;min-height:clamp(380px,calc(100svh - 290px),640px)}
.qwrap.no{animation:flyL .46s cubic-bezier(.55,0,.8,.4) forwards}
.opt{position:relative;display:flex;align-items:center;gap:8px;width:100%;min-height:72px;text-align:left;background:var(--bg);color:var(--ink);border:1.5px solid var(--line);border-radius:18px;padding:8px 8px;font-size:17.5px;font-weight:700}
.opt b{flex:0 0 34px;height:34px;border-radius:11px;display:grid;place-items:center;background:var(--hero);border:1px solid var(--herob);font-size:15px;font-weight:800}
.opt span{flex:1;min-width:0;overflow-wrap:break-word;word-break:normal;hyphens:none;line-height:1.15}
.opt span.lg{font-size:15px}
.opt i{position:absolute;right:8px;top:8px;width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font-style:normal;font-size:13px;font-weight:800;color:#fff}
.opt i:empty{display:none}
.opt:active:not(.ok):not(.bad){border-color:var(--acc)}
.opt.ok{border-color:var(--go);background:rgba(94,224,192,.14)}.opt.ok i{background:#1fae8c}
.opt.bad{border-color:#ff7a7a;background:rgba(255,122,122,.14)}.opt.bad i{background:#ff5d5d}
.opt.dim{opacity:.5}
.opt.ok,.opt.bad,.opt.dim{pointer-events:none}
.opts .opt{animation:rise .5s cubic-bezier(.2,.8,.2,1) backwards}
.opts .opt:nth-child(1){animation-delay:.2s}.opts .opt:nth-child(2){animation-delay:.28s}.opts .opt:nth-child(3){animation-delay:.36s}.opts .opt:nth-child(4){animation-delay:.44s}
.opts .opt.bad{animation:shake .4s}
.fb{min-height:28px;text-align:center;font-weight:700;margin:4px 0 10px;font-size:17px}
.pals{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.pal{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);color:var(--ink);border:1.5px solid var(--line);border-radius:18px;padding:12px 14px;font-size:17px}
.pal.on{border-color:var(--acc)}
.pal .sw{display:flex}.pal .sw i{width:26px;height:26px;border-radius:50%;border:2px solid var(--card);margin-left:-8px;box-shadow:0 0 0 1px var(--line)}.pal .sw i:first-child{margin-left:0}
.pal em{margin-left:auto;font-style:normal;color:var(--acc);font-weight:800;font-size:20px}
.achs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}
.ach{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px 10px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;animation:rise .45s cubic-bezier(.2,.8,.2,1) backwards}
.ach:nth-child(2n){animation-delay:.06s}.ach:nth-child(3n){animation-delay:.12s}
.ach .bdg{width:72px;height:72px;border-radius:50%;background:var(--hero);border:2px solid var(--herob);display:grid;place-items:center}
.ach:not(.on) .bdg{filter:grayscale(1);opacity:.4}
.ach:not(.on) b{opacity:.6}
.ach b{font-size:15px}.ach small{color:var(--mute);font-size:12px;line-height:1.25}
.ach em{font-style:normal;font-size:11px;color:var(--go);font-weight:700}
html[data-mono] .tgA{fill:#9b8cff}
.hmw{display:flex;margin-top:10px}
.hml{display:grid;grid-template-rows:repeat(7,11px);gap:3px;font-size:9px;color:var(--mute);line-height:11px;margin:19px 6px 0 0;flex:none}
.hms{overflow-x:auto;flex:1;min-width:0;padding-bottom:6px;animation:fadeIn .6s}
.hmm{display:flex;gap:3px;height:16px;width:max-content;font-size:10px;color:var(--mute)}
.hmm span{flex:none;width:11px;white-space:nowrap;overflow:visible}
.hmg{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,11px);grid-auto-columns:11px;gap:3px;width:max-content}
.hmg i,.hmlg i{display:block;width:11px;height:11px;border-radius:3px;background:var(--line)}
.hmg i.l1,.hmlg i.l1{background:var(--acc);opacity:.3}.hmg i.l2,.hmlg i.l2{background:var(--acc);opacity:.55}
.hmg i.l3,.hmlg i.l3{background:var(--acc);opacity:.8}.hmg i.l4,.hmlg i.l4{background:var(--acc)}
.hmg i.fut{visibility:hidden}.hmg i.td{box-shadow:0 0 0 2px var(--ink)}
.hmlg{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--mute);justify-content:flex-end;margin-top:6px}
.spc{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);color:var(--ink);border:1.5px solid var(--line);border-radius:20px;padding:14px 16px;margin:-8px 0 22px}
.spc .spi{flex:none;width:52px;height:52px;border-radius:16px;background:var(--hero);border:1px solid var(--herob);display:grid;place-items:center}
.spc b{display:block;font-size:17px}.spc small{color:var(--mute);font-weight:600}.spc em{margin-left:auto;font-style:normal;color:var(--acc);font-size:24px}
.sptb{flex:1;height:10px;border-radius:6px;background:var(--line);overflow:hidden;margin:0 12px}
.sptb i{display:block;height:100%;width:100%;background:var(--go);border-radius:6px;transition:width .12s linear}.sptb i.low{background:#ff7a7a}
.spn{font-size:22px;min-width:34px;text-align:right}
.spst{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:6px 2px 10px;min-height:26px;font-weight:800}.spst span{display:inline-flex;align-items:center;gap:6px}
.spw{background:var(--card);border:1px solid var(--line);border-top:12px solid var(--acc);border-radius:26px;padding:14px 12px 12px}
.spq .opts{margin-top:0}.spq .opts .opt{animation:none}.spq .opts .opt.bad{animation:shake .4s}.spq .qcard{padding:8px 4px 18px}
.fx{font-weight:800;animation:rise .6s both}.fx.up{color:var(--go)}.fx.dn{color:#ff7a7a}
.opt span{overflow-wrap:normal;word-break:normal}
.opt b{flex:0 0 30px!important;height:30px!important;font-size:14px!important;border-radius:10px!important}
.mi{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:9px 0;border-top:1px solid var(--line)}
.mi:first-of-type{border-top:0}
.mi span{min-width:0;overflow-wrap:anywhere}.mi small{display:block;color:var(--mute);font-weight:600}
.mi b{color:var(--go);text-align:right;flex:none;max-width:45%;overflow-wrap:anywhere}
.hi{background:var(--bg);border:1px solid var(--line);border-radius:18px;margin-top:10px;overflow:hidden}
.hi summary{list-style:none;display:flex;align-items:center;gap:12px;padding:12px;cursor:pointer}
.hi summary::-webkit-details-marker{display:none}
.hs{position:relative;flex:none;width:52px;height:52px;border-radius:15px;background:var(--hero);border:1px solid var(--herob);display:grid;place-items:center;font-size:22px;font-weight:800}
.hs u{position:absolute;top:-7px;right:-7px;text-decoration:none;font-size:15px}
.hmd{flex:1;min-width:0}.hmd b{font-size:16px}.hmd small{display:block;color:var(--mute);font-weight:600;font-size:12.5px;margin-top:2px}
.hbar{height:6px;border-radius:4px;background:rgba(255,122,122,.3);margin-top:8px;overflow:hidden}.hbar i{display:block;height:100%;background:var(--go);border-radius:4px}
.hx{flex:none;font-weight:800;font-size:13px;padding:5px 9px;border-radius:10px}
.hx.bad{background:rgba(255,122,122,.16);color:#ff7a7a}.hx.good{background:rgba(94,224,192,.16);color:var(--go)}
.hi summary em{flex:none;font-style:normal;color:var(--mute);font-size:20px;transition:transform .2s}.hi[open] summary em{transform:rotate(90deg)}
.hb{padding:0 14px 12px;border-top:1px solid var(--line)}
.hst{display:flex;gap:8px;flex-wrap:wrap;padding:10px 0 4px;font-weight:700;font-size:13px;color:var(--mute)}
.hst span{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:3px 8px}
.hhd{display:flex;align-items:center;justify-content:space-between}.hhd i{font-style:normal;font-size:13px;font-weight:800;color:var(--mute);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px 9px}
/* settings */
.pcs{display:flex;gap:12px;flex-wrap:wrap}
.pc{width:48px;height:48px;border-radius:50%;padding:0;background:var(--a);border:3px solid var(--card);box-shadow:0 0 0 1.5px var(--line)}
.pc.on{box-shadow:0 0 0 3px var(--ink)}
.sb{display:inline-flex;align-items:center;justify-content:center;gap:8px}
.lgb{padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;line-height:1.1}
.lgb span{font-size:24px}.lgb small{font-size:12px;font-weight:700}
.gearI svg{animation:spinIn .8s cubic-bezier(.2,.8,.2,1) both}
@keyframes spinIn{from{transform:rotate(-120deg) scale(.6);opacity:0}to{transform:none;opacity:1}}
/* onboarding */
.ob{min-height:calc(100svh - 70px);display:flex;flex-direction:column}
.obt{display:flex;justify-content:space-between;align-items:center;min-height:48px;gap:10px}
.obl{display:flex;gap:8px}
.obl button{padding:8px 12px;font-size:16px;border-radius:12px}
.obs{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px;padding:10px 6px;animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
.obi{width:156px;height:156px;border-radius:46px;background:var(--hero);border:1px solid var(--herob);display:grid;place-items:center;margin-bottom:14px}
.obi svg{animation:bump .7s .1s both}
.obs h1{margin:0}
.obs p{max-width:340px;font-size:17px;color:var(--mute);margin:0}
.obd{display:flex;justify-content:center;gap:8px;margin:18px 0}
.obd i{width:8px;height:8px;border-radius:4px;background:var(--line);transition:width .25s,background-color .25s}
.obd i.on{width:26px;background:var(--acc)}

/* v32: компактнее и мягче */
body{font-size:15px;padding:16px 16px 40px;max-width:480px}
h1{font-size:clamp(20px,6.4vw,26px);margin:2px 0 6px;letter-spacing:-.3px}
h2{font-size:16px;margin:0 0 10px}
p{margin:0 0 10px}
.mute{font-size:13px}
button{padding:11px 14px;border-radius:12px;font-weight:600;transition:transform .18s ease,opacity .2s,background-color .3s,box-shadow .2s}
.ans button{padding:18px;font-size:18px;font-weight:700}
.ans .no{background:rgba(255,122,122,.16);color:#ff8f8f;border:2px solid rgba(255,122,122,.45)}
:root[data-th=light] .ans .no{background:rgba(214,69,69,.1);color:#c93a3a;border-color:rgba(214,69,69,.4)}
input,textarea{padding:11px;border-radius:12px}
.bar0{margin-bottom:8px}
.dots{width:40px;height:40px}
.hero{padding:16px;border-radius:22px;margin-bottom:18px;box-shadow:0 8px 24px rgba(0,0,0,.16)}
.hero .n{font-size:44px}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:14px}
.hl{min-width:0;flex:1}
.hl .mute{margin:2px 0 12px}
.hl button{padding:10px 20px}
.rg{flex:none;width:92px;height:92px;padding:0;background:transparent;border-radius:50%}
.rg svg{display:block}
.spc{padding:11px 14px;margin:-4px 0 16px;border-radius:18px}
.spc .spi{width:44px;height:44px;border-radius:14px}
.spc b{font-size:15px}
.grid{gap:20px 16px;padding:0 10px 10px 0;margin-bottom:14px}
.top{min-height:124px;padding:12px;border-radius:16px;box-shadow:0 6px 16px rgba(0,0,0,.16)}
.top small{font-size:12px}
.tag{font-size:12px;padding:1px 8px}
.stack i{border-radius:16px}
.stack i:nth-child(1){transform:translate(10px,10px) rotate(2deg)}
.stack i:nth-child(2){transform:translate(5px,5px) rotate(1deg)}
.new{min-height:124px;border-radius:16px}
.box{padding:14px;border-radius:18px;margin-bottom:12px}
.head{padding:14px;border-radius:22px;margin-bottom:16px}
.stats b{font-size:19px}
.scene{height:290px;margin-bottom:34px}
.face{font-size:24px;padding:20px;border-radius:24px}
.card{transition:transform .65s cubic-bezier(.3,.7,.2,1)}
.qs{font-size:clamp(20px,6vw,26px)}
.opt{min-height:62px;font-size:16px}
.acts{display:flex;gap:8px;flex:none}
.eb{display:inline-block;background:#ff7a7a;color:#fff;border-radius:6px;font-size:11px;font-weight:800;padding:0 6px;margin-left:4px}
.cd.ed{padding:12px 0}

/* ===== Liquid Glass (v33) ===== */
html[data-glass][data-th]{--gbg:rgba(255,255,255,.10);--gbd:rgba(255,255,255,.32);--gsh:0 6px 18px rgba(0,0,0,.32);--gin:inset 0 1px 1px rgba(255,255,255,.55),inset 0 -1px 1px rgba(255,255,255,.10),inset 0 12px 16px -10px rgba(255,255,255,.25);--gsheen:rgba(255,255,255,.22);--gtx:#fff;--tpd:55%;--yes:#34d399;--no:#ff6b6b;--yt:#fff;--nt:#fff}
html[data-glass][data-th=light]{--gbg:rgba(255,255,255,.55);--gbd:rgba(255,255,255,.95);--gsh:0 6px 16px rgba(60,70,140,.20);--gin:inset 0 1px 1px #fff,inset 0 -1px 1px rgba(60,70,140,.14),inset 0 12px 16px -10px rgba(255,255,255,.9);--gsheen:rgba(255,255,255,.6);--gtx:var(--ink);--yes:#12a874;--no:#e04848;--yt:#064e3b;--nt:#7f1d1d}
html[data-glass][data-mono][data-th]{--tpd:32%}
html[data-glass][data-mono][data-th=light]{--tpd:30%}
html[data-glass][data-th] button{--t:var(--go);--tp:var(--tpd);--ga:0;background-color:var(--t);background-image:linear-gradient(rgba(255,255,255,var(--ga)),rgba(255,255,255,var(--ga))),linear-gradient(180deg,var(--gsheen) 0,rgba(255,255,255,.05) 45%,rgba(255,255,255,0) 100%);border-color:transparent;box-shadow:0 0 0 1px var(--gbd),var(--gin),var(--gsh);transition:transform .18s ease,box-shadow .2s,background-color .3s,opacity .2s}
html[data-glass][data-th] button:active:not(:disabled){--ga:.2}
@supports (background-color:color-mix(in srgb,red 50%,transparent)){
html[data-glass][data-th] button{background-color:color-mix(in srgb,var(--t) var(--tp),transparent);color:var(--gtx)}
}
@supports ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
html[data-glass][data-th] button{-webkit-backdrop-filter:blur(14px) saturate(1.6);backdrop-filter:blur(14px) saturate(1.6)}
}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
html[data-glass][data-th]{--gbg:rgba(255,255,255,.18);--tpd:70%}
html[data-glass][data-th=light]{--gbg:rgba(255,255,255,.78);--tpd:70%}
html[data-glass][data-mono][data-th]{--tpd:45%}
html[data-glass][data-mono][data-th=light]{--tpd:42%}
}
/* нейтральные стеклянные */
html[data-glass][data-th] .g,html[data-glass][data-th] .opt,html[data-glass][data-th] .pal,html[data-glass][data-th] .spc,html[data-glass][data-th] .dots,html[data-glass][data-th] .spk,html[data-glass][data-th] .new{background-color:var(--gbg);color:var(--ink)}
html[data-glass][data-th] .new{color:var(--mute)}
html[data-glass][data-th] .new i{color:var(--ink)}
/* цветные */
html[data-glass][data-th] .top{--t:var(--c);--tp:80%;color:#fff;box-shadow:0 0 0 1px var(--gbd),var(--gin),0 6px 16px rgba(0,0,0,.22)}
html[data-glass][data-th] .stack:active .top{transform:scale(.97)}
html[data-glass][data-th] .head .bk{--t:#fff;--tp:24%;color:#fff}
html[data-glass][data-th] .start{--t:#5ee0c0;--tp:58%;color:#fff}
html[data-glass][data-th] .ans button{border:2px solid transparent;--t:var(--yes);--tp:52%;color:var(--yt)}
html[data-glass][data-th] .ans .no{--t:var(--no);color:var(--nt)}
/* варианты ответов */
html[data-glass][data-th] .opt.ok{background-color:color-mix(in srgb,var(--yes) 28%,transparent);box-shadow:0 0 0 1.5px var(--yes),var(--gin),var(--gsh)}
html[data-glass][data-th] .opt.bad{background-color:color-mix(in srgb,var(--no) 28%,transparent);box-shadow:0 0 0 1.5px var(--no),var(--gin),var(--gsh)}
html[data-glass][data-th] .pal.on{box-shadow:0 0 0 1.5px var(--acc),var(--gin),var(--gsh)}
/* кружки палитры */
html[data-glass][data-th] .pc{background-color:var(--a);border-color:var(--card);box-shadow:0 0 0 1.5px var(--line),inset 0 3px 4px rgba(255,255,255,.45),inset 0 -3px 5px rgba(0,0,0,.18);-webkit-backdrop-filter:none;backdrop-filter:none}
html[data-glass][data-th] .pc.on{box-shadow:0 0 0 3px var(--ink),inset 0 3px 4px rgba(255,255,255,.45),inset 0 -3px 5px rgba(0,0,0,.18)}
/* не кнопки по виду: строки меню и кольцо цели */
html[data-glass][data-th] .it,html[data-glass][data-th] .rg{background:none;background-color:transparent;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none}
html[data-glass][data-th] .it{border-color:transparent;border-top-color:var(--line);color:var(--ink)}
html[data-glass][data-th] .pop .it:first-child{border-top-color:transparent}

/* ===== Объёмные кнопки: обычный режим, без Liquid Glass (v34) ===== */
html:not([data-glass]){--ge:#070a1c;--hl:rgba(255,255,255,.38);--hg:rgba(255,255,255,.10);--sh:rgba(0,0,0,.38);--yes:#34d399;--no:#ff6b6b;--yt:#053b2c;--nt:#4a0d0d}
html:not([data-glass])[data-th=light]{--ge:#b3b9e2;--hl:rgba(255,255,255,.75);--hg:#fff;--sh:rgba(40,50,120,.28);--yes:#12a874;--no:#e04848;--yt:#fff;--nt:#fff}
/* основа: цветная выпуклая кнопка */
html:not([data-glass]) button{
  --b:var(--go);--e:rgba(0,0,0,.38);
  background-color:var(--b);
  background-image:linear-gradient(180deg,rgba(255,255,255,.32) 0,rgba(255,255,255,.08) 48%,rgba(0,0,0,.07) 100%);
  border:0;
  box-shadow:0 4px 0 var(--e),0 10px 14px -4px var(--sh),inset 0 1.5px 0 var(--hl),inset 0 -2px 0 rgba(0,0,0,.10);
  transition:transform .12s ease,box-shadow .12s ease,opacity .2s,background-color .3s}
@supports (background-color:color-mix(in srgb,red 50%,blue)){
html:not([data-glass]) button{--e:color-mix(in srgb,var(--b) 58%,#000)}
}
html:not([data-glass]) button:active:not(:disabled){
  transform:translateY(4px);
  box-shadow:0 0 0 var(--e),0 2px 4px -2px var(--sh),inset 0 1.5px 0 var(--hl),inset 0 -2px 0 rgba(0,0,0,.10)}
html:not([data-glass]) button:disabled{box-shadow:0 4px 0 var(--e),inset 0 1.5px 0 var(--hl),inset 0 -2px 0 rgba(0,0,0,.10)}
/* место под нижнюю грань */
html:not([data-glass]) .w,html:not([data-glass]) .row>button,html:not([data-glass]) .ans button{margin-bottom:4px}

/* нейтральные: «карточные» кнопки */
html:not([data-glass]) .g,html:not([data-glass]) .dots,html:not([data-glass]) .opt,html:not([data-glass]) .pal,html:not([data-glass]) .spc{
  --b:var(--card);--e:var(--ge);--hl:var(--hg);
  background-color:var(--card);color:var(--ink);
  background-image:linear-gradient(180deg,rgba(255,255,255,.08) 0,rgba(255,255,255,0) 60%);
  border:1.5px solid var(--line)}
html:not([data-glass]) .pal.on,html:not([data-glass]) .g.on{border-color:var(--acc)}
html:not([data-glass]) .spk{
  --e:var(--ge);--hl:var(--hg);color:var(--ink);
  background-image:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,0)),var(--hero);
  border:1.5px solid var(--herob)}

/* варианты ответов в квизе */
html:not([data-glass]) .opt.ok{--e:#17917a;border-color:var(--yes);background-color:rgba(94,224,192,.18);background-color:color-mix(in srgb,var(--yes) 24%,var(--card))}
html:not([data-glass]) .opt.bad{--e:#b83a3a;border-color:var(--no);background-color:rgba(255,122,122,.18);background-color:color-mix(in srgb,var(--no) 24%,var(--card))}

/* цветные */
html:not([data-glass]) .start{--b:#5ee0c0;--e:#2d9e84;color:#0e1226}
html:not([data-glass]) .head .bk{background-color:rgba(255,255,255,.26);--e:rgba(0,0,0,.28);color:#fff}
html:not([data-glass]) .ans button{--b:var(--yes);--e:rgba(0,0,0,.28);color:var(--yt);border:0}
html:not([data-glass]) .ans .no{--b:var(--no);background-color:var(--no);color:var(--nt);border:0}
@supports (background-color:color-mix(in srgb,red 50%,blue)){
html:not([data-glass]) .ans button{--e:color-mix(in srgb,var(--yes) 58%,#000)}
html:not([data-glass]) .ans .no{--e:color-mix(in srgb,var(--no) 58%,#000)}
}

/* колоды-карточки: объём внутри, стопка остаётся */
html:not([data-glass]) .top{
  --e:rgba(0,0,0,.25);
  box-shadow:0 10px 18px -6px rgba(0,0,0,.4),inset 0 2px 0 rgba(255,255,255,.4),inset 0 -5px 0 rgba(0,0,0,.2);
  transition:transform .22s cubic-bezier(.2,.8,.2,1),box-shadow .2s,background-color .35s}
html:not([data-glass]) .top{--b:var(--c);background-color:var(--c);color:#fff}
html:not([data-glass]) .stack:active .top{
  transform:translateY(-5px) scale(1.03);
  box-shadow:0 16px 24px -6px rgba(0,0,0,.45),inset 0 2px 0 rgba(255,255,255,.4),inset 0 -5px 0 rgba(0,0,0,.2)}

/* кнопка «+ новая» — плоская, пунктир */
html:not([data-glass]) .new{background-color:transparent;background-image:none;box-shadow:none;border:2px dashed var(--line);color:var(--mute)}
html:not([data-glass]) .new:active:not(:disabled){transform:scale(.96);box-shadow:none}

/* кружки палитры — шарики */
html:not([data-glass]) .pc{
  background-color:var(--a);
  background-image:radial-gradient(circle at 32% 26%,rgba(255,255,255,.7) 0,rgba(255,255,255,0) 48%),linear-gradient(180deg,rgba(255,255,255,0) 50%,rgba(0,0,0,.24));
  border:3px solid var(--card);
  box-shadow:0 0 0 1.5px var(--line),0 5px 8px -1px var(--sh),inset 0 -4px 6px rgba(0,0,0,.22)}
html:not([data-glass]) .pc.on{box-shadow:0 0 0 3px var(--ink),0 5px 8px -1px var(--sh),inset 0 -4px 6px rgba(0,0,0,.22)}
html:not([data-glass]) .pc:active:not(:disabled){transform:scale(.92);box-shadow:0 0 0 1.5px var(--line),inset 0 -4px 6px rgba(0,0,0,.22)}

/* не кнопки по виду: строки меню и кольцо цели */
html:not([data-glass]) .it,html:not([data-glass]) .rg{background:none;background-color:transparent;box-shadow:none}
html:not([data-glass]) .it{border:0;border-top:1px solid var(--line);color:var(--ink)}
html:not([data-glass]) .pop .it:first-child{border-top:0}
html:not([data-glass]) .it:active:not(:disabled),html:not([data-glass]) .rg:active:not(:disabled){transform:none;box-shadow:none;opacity:.6}

/* ===== анимации: пружинные кнопки, переходы между экранами, смена языка ===== */
button{transition:transform .55s cubic-bezier(.34,1.56,.64,1),box-shadow .28s,opacity .2s,background-color .3s,filter .2s!important}
button:active:not(:disabled){transform:scale(.92);transition-duration:.07s,.07s,.2s,.3s,.2s!important}
html:not([data-glass]) button:active:not(:disabled){transform:translateY(4px) scale(.97)}
.stack:active .top{transition:transform .12s cubic-bezier(.2,.8,.2,1),box-shadow .12s!important}
.stack .top{transition:transform .5s cubic-bezier(.34,1.56,.64,1),box-shadow .3s,background-color .35s!important}
.tap{position:fixed;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:var(--acc);opacity:.42;pointer-events:none;z-index:9999;animation:tapR .6s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes tapR{to{transform:scale(6.5);opacity:0}}
#app.out{opacity:0;transform:translateY(10px) scale(.985);filter:blur(6px);transition:opacity .17s ease-in,transform .17s ease-in,filter .17s ease-in}
@keyframes slideF{from{opacity:0;transform:translateX(34px) scale(.98)}to{opacity:1;transform:none}}
@keyframes slideB{from{opacity:0;transform:translateX(-34px) scale(.98)}to{opacity:1;transform:none}}
#app[data-dir=fwd].enter>*:not(.grid){animation-name:slideF;animation-duration:.55s}
#app[data-dir=back].enter>*:not(.grid){animation-name:slideB;animation-duration:.55s}
.lgb:not(.g),.pal.on,.pc.on{animation:bump .55s cubic-bezier(.34,1.56,.64,1)}
.swrow input::after{transition:transform .35s cubic-bezier(.34,1.56,.64,1),width .2s,background .25s}
.swrow input:active::after{width:30px}
.swrow input:checked:active::after{transform:translateX(15px)}
.crs button{transition:transform .5s cubic-bezier(.34,1.56,.64,1)!important}

  try{
    const o=JSON.parse(clean);
    const arr=Array.isArray(o)?o:o.cards;
    const cards=(arr||[]).map(c=>Array.isArray(c)?[c[0],c[1]]:[c.q||c.f,c.a||c.b,c.o||c.options]).filter(c=>c[0]&&c[1]);
    if(cards.length)return{cat:o.category||'',level:o.level||'',name:(o.name||fb||t('newdeck')),cards};
  }catch(e){}
  const cards=[];
  clean.split('\n').forEach(l=>{const j=l.indexOf('=');if(j<1)return;const f=l.slice(0,j).trim(),b=l.slice(j+1).trim();if(f&&b)cards.push([f,b])});

}

  const sent=p.length>1?esc(p[0])+'<span class="blank" id="bl"></span>'+esc(p.slice(1).join('___')):esc(c.f);
  const top=rv?`<div class="sptb"><i style="width:${(sp.total-sp.queue.length)/sp.total*100}%"></i></div><b class="spn">${sp.queue.length}</b>`:`<div class="sptb"><i id="spb"></i></div><b id="spt" class="spn"></b>`;
  return `<div class="spq"><div class="sbar"><button class="g x" onclick="spOpen()" aria-label="✕">✕</button>${top}</div>
  <div class="spst"><span>${rv?'↻':IC.bolt(18)} <b id="spsc">${sp.score}</b></span><span id="spcb">${!rv&&sp.combo>=3?IC.fire(18)+' ×'+sp.combo:''}</span><span id="spfx"></span></div>
  <div class="spw"><div class="qcard"><small>${esc(c.dn)}</small><div class="qs">${sent}</div></div>
  <div class="opts">${c.o.map((v,i)=>`<button class="opt" onclick="spPick(${i})"><b>${L[i]}</b><span class="${v.length>9?'lg':''}">${esc(v)}</span><i></i></button>`).join('')}</div></div></div>`;
}
function popHTML(){
  if(!pop)return '';
  const body=pop==='menu'
   ?`<button class="it" onclick="go('streak')"><span>${IC.fire(20)}</span>${t('streakT')}<small>${t('days',D.st.streak)}</small></button><button class="it" onclick="go('goal')"><span>${IC.target(20)}</span>${t('goalT')}<small>${Math.min(D.st.n,D.goal)}/${D.goal}</small></button><button class="it" onclick="go('ach')"><span>${IC.trophy(20)}</span>${t('achT')}<small>${Object.keys(D.ach).length}/${ACH.length}</small></button><button class="it" onclick="go('settings')"><span>${IC.gear(20)}</span>${t('setT')}</button>`
   :`<button class="it" onclick="setPop('menu')"><span>‹</span>${t('lang')}</button>`+NATIVE.map((n,i)=>`<button class="it" onclick="setLang(${i})"><span>${FLAG[i]}</span>${n}<small>${D.lang===i?'✓':''}</small></button>`).join('');
  return `<div class="pop">${body}</div>`;
}

function render(){
  checkDay();
  const a=$('#app');
  if(view==='onb'){onbRender();return}
  const tb=anchHTML()+(pop?`<div class="bd" onclick="setPop(null)"></div>`:'');
  const bk=(to,label)=>`<button class="g" onclick="go('${to}')">${label}</button>`;
  if(view==='home'){
    const all=D.cats.reduce((s,c)=>s+sum(c,dueD),0);
    a.innerHTML=`<div class="bar0"><span class="mute">${t('today')} · <b style="color:var(--ink);display:inline-flex;align-items:center;gap:4px;vertical-align:middle">${IC.fire(18)}${D.st.streak}</b></span>${tb}</div>
    ${warn()}<div class="hero"><div class="fl"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div><div class="hrow"><div class="hl"><div class="n">${all}</div><div class="mute">${all?t('heroN'):t('heroZ')}</div><button onclick="study('all')" ${all?'':'disabled'}>${t('start')}</button></div>${ringHTML()}</div></div>
    <button class="spc" onclick="spOpen()"><span class="spi">${IC.bolt(34)}</span><span><b>${t('spT')}</b><small>${t('spBest')}: ${Math.max((D.sp&&D.sp.r30)||0,(D.sp&&D.sp.r60)||0)}</small></span><em>›</em></button>
    ${errN('u')?`<button class="spc" onclick="studyErr('u')"><span class="spi">${IC.redo(26)}</span><span><b>${t('errT')}</b><small>${t('errSub',errN('u'))}</small></span><em>›</em></button>`:''}<h2>${t('secs')}</h2><div class="grid">`+courseStacks()+D.cats.map((c,k)=>{if(crOf(c)!=='u')return '';
      const n=sum(c,d=>d.cards.length),l=sum(c,lrnD);
      return stack(col(c),`go('cat',${k})`,cni(c),dueTag(sum(c,dueD),n?t('allrev'):t('empty')),`${t('dN',c.decks.length)} · ${t('cN',n)}`,n?l/n*100:0);
    }).join('')+
    `<button class="new" onclick="go('newcat')"><i>+</i>${t('newsec')}</button></div>
    <div class="box"><h2>${t('fromT')}</h2><p class="mute">${t('fromTp')}</p>
    <div class="row"><button class="w" onclick="go('imp')">${t('paste')}</button><button class="g" onclick="copy(t('aitask'),t('prompt'))">${t('aitask')}</button></div></div>`;
  }else if(view==='newcat'||view==='newdeck'){
    const isC=view==='newcat';
    a.innerHTML=`<div class="bar0">${bk(isC?'home':'cat',t('back'))}</div><h1>${isC?t('newsec'):t('newdeck')}</h1>
    <p class="mute">${isC?t('secHelp'):esc(t('deckHelp',cn(D.cats[ci])))}</p>
    <input id="nn" placeholder="${isC?t('secName'):t('deckName')}" maxlength="40"><button class="w" onclick="${isC?'newCat()':'newDeck()'}">${t('create')}</button>`;
  }else if(view==='imp'){
    const pre=(back==='cat'&&D.cats[ci])?cn(D.cats[ci]):'';
    a.innerHTML=`<div class="bar0">${bk('home',t('back'))}</div><h1>${t('impH')}</h1>
    <p class="mute">${t('impP')}</p>
    <textarea id="imp" rows="7" placeholder='{"category":"English","name":"Word translation","cards":[{"q":"cat","a":"кошка"}]}'></textarea>
    <input id="icat" placeholder="${t('impSec')}" maxlength="40" value="${esc(pre)}">
    <input id="inm" placeholder="${t('impName')}" maxlength="40">
    <p class="mute" style="margin-bottom:6px">${t('orFile')}</p><input type="file" accept=".json,.txt" onchange="pickFile(this)">
    <button class="w" onclick="doImport()">${t('addDeck')}</button>`;
  }else if(view==='text'){
    a.innerHTML=`<div class="bar0">${bk('home',t('back'))}</div><h1>${esc(tx.t)}</h1>
    <p class="mute">${t('copyFail')}</p><textarea rows="10" readonly onfocus="this.select()">${esc(tx.s)}</textarea>`;
  }else if(view==='course'){
    const [l,fl]=CRM[D.course];
    a.innerHTML=`<div class="bar0">${bk('home',t('back'))}</div><h1>${fl} ${esc(t(l))}</h1>${errN(D.course)?`<button class="spc" onclick="studyErr('${D.course}')"><span class="spi">${IC.redo(26)}</span><span><b>${t('errT')}</b><small>${t('errSub',errN(D.course))}</small></span><em>›</em></button>`:''}<div class="grid">`+D.cats.map((c,k)=>{
      if(!inCourse(c))return '';
      const n=sum(c,d=>d.cards.length),lr=sum(c,lrnD);
      return stack(col(c),`go('cat',${k})`,cni(c),dueTag(sum(c,dueD),n?t('allrev'):t('empty')),`${t('dN',c.decks.length)} · ${t('cN',n)}`,n?lr/n*100:0);
    }).join('')+`</div>`;
  }else if(view==='cat'){
    const c=D.cats[ci],n=sum(c,d=>d.cards.length);
    a.innerHTML=`<div class="head" style="--c:${col(c)}"><button class="bk" onclick="go('${crOf(c)==='u'?'home':'course'}')">${t('secsBack')}</button><h1>${esc(cni(c))}</h1>
    <div class="stats"><div><b>${c.decks.length}</b>${t('decksL')}</div><div><b>${n}</b>${t('cardsL')}</div><div><b>${sum(c,dueD)}</b>${t('todayL')}</div></div>
    <button class="w start" onclick="study('cat')" ${sum(c,dueD)?'':'disabled'}>${sum(c,dueD)?t('revSec'):t('allrevToday')}</button></div>
    <h2>${t('decksH')}</h2><div class="grid">`+c.decks.map((d,k)=>stack(col(d),`go('deck',${ci},${k})`,dni(d),dueTag(dueD(d),d.cards.length?t('allrev'):t('deckEmpty')),`${t('cN',d.cards.length)} · ${t('lrn',lrnD(d))}`,d.cards.length?lrnD(d)/d.cards.length*100:0,d.level)).join('')+
    `<button class="new" onclick="go('newdeck')"><i>+</i>${t('newdeck')}</button></div>
    <div class="row"><button class="g" onclick="back='cat';go('imp')">${t('paste')}</button><button class="g" onclick="delCat()">${arm?t('again'):t('delSec')}</button></div>`;
  }else if(view==='deck'){
    const c=D.cats[ci],d=c.decks[di];
    a.innerHTML=`<div class="head" style="--c:${col(d)}"><button class="bk" onclick="go('cat')">← ${esc(cn(c))}</button><h1>${esc(dni(d))}${d.level?` <span class="lv">${esc(d.level)}</span>`:''}</h1>
    <div class="stats"><div><b>${d.cards.length}</b>${t('totalL')}</div><div><b>${lrnD(d)}</b>${t('learnedL')}</div><div><b>${dueD(d)}</b>${t('todayL')}</div></div>
    <button class="w start" onclick="study('deck')" ${dueD(d)?'':'disabled'}>${dueD(d)?t('revBtn'):t('allrevToday')}</button></div>
    <div class="box"><h2>${t('addCardH')}</h2><input id="cf" placeholder="${t('qPh')}" maxlength="200"><input id="cb" placeholder="${t('aPh')}" maxlength="200"><button class="w" onclick="addCard()">${t('add')}</button></div>
    <div class="box"><h2>${t('cardsH')}</h2>`+(d.cards.map((x,k)=>cardRow(d,x,k)).join('')||`<p class="mute">${t('noCards')}</p>`)+`</div>
    <div class="row"><button class="g" onclick="exportDeck()">${t('share')}</button><button class="g" onclick="delDeck()">${arm?t('again'):t('delDeck')}</button></div>`;
  }else if(view==='streak'){
    const st=D.st,WD=[['Su','Mo','Tu','We','Th','Fr','Sa'],['Вс','Пн','Вт','Ср','Чт','Пт','Сб'],['Ýk','Dş','Sş','Çş','Pş','An','Şn']][D.lang];
    const days=[];for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);days.push([d.getDay(),D.hist[dstr(d)]||0,i===0])}
    const mx=Math.max(D.goal,...days.map(x=>x[1]),1);
    a.innerHTML=`<div class="bar0">${bk('home',t('back'))}</div>
    <div class="streakbox"><div class="flame">${IC.fire(84)}</div><div class="sn">${st.streak}</div><div class="mute">${st.streak?t('days',st.streak):t('streakNone')}</div></div>
    ${warn()}
    <div class="box"><h2>${t('livesT')}</h2><div class="hearts">${[0,1,2].map(i=>`<span class="hrt ${i<st.lives?'on':''}">${IC.heart(38)}</span>`).join('')}</div><p class="mute" style="margin-top:10px">${t('livesNote')}</p></div>
    <div class="box"><h2>${t('statsT')}</h2><div class="chart">${days.map(x=>`<div><i style="height:${Math.round(x[1]/mx*90)+3}px;${x[2]?'background:var(--go)':''}"></i><span>${WD[x[0]]}</span></div>`).join('')}</div><p class="mute">${t('best')}: ${t('days',st.best)}</p></div>${heatmap()}`;
    setTimeout(()=>{const e=$('#hm');if(e)e.scrollLeft=e.scrollWidth},60);
  }else if(view==='sprint'){
    a.innerHTML=spView();
  }else if(view==='settings'){
    const cur=D.pal||'violet';
    a.innerHTML=`<div class="bar0">${bk('home',t('back'))}</div><h1 class="gearI" style="display:flex;align-items:center;gap:10px">${IC.gear(34)}${t('setT')}</h1>
    <div class="box"><h2>${t('palT')}</h2><div class="pcs">${PAL.map(p=>{const m=TH==='dark'?p.d:p.l;return `<button class="pc ${cur===p.k?'on':''}" style="--a:${m.acc}" onclick="setPal('${p.k}')" aria-label="${t('pal_'+p.k)}"></button>`}).join('')}</div><p class="mute" style="margin:12px 0 0">${t('pal_'+cur)}</p></div>
    <div class="box"><h2>${t('theme')}</h2><div class="row"><button class="sb ${TH==='light'?'':'g'}" onclick="if(TH!=='light')theme()">${IC.sun(20)}${t('light')}</button><button class="sb ${TH==='dark'?'':'g'}" onclick="if(TH!=='dark')theme()">${IC.moon(20)}${t('dark')}</button></div></div>
    <div class="box"><label class="swrow"><span class="sb">${IC.spk(24)}${t('snd')}</span><input type="checkbox" ${D.snd===false?'':'checked'} onchange="D.snd=this.checked;save();sfx('ok')"></label></div>
    <div class="box"><label class="swrow"><span class="sb">${IC.glass(24)}<span>${t('glass')}<small class="mute" style="display:block;font-weight:500">${t('glassD')}</small></span></span><input type="checkbox" ${D.glass===false?'':'checked'} onchange="D.glass=this.checked;applyGlass();save()"></label></div>
    <div class="box"><h2>${t('lang')}</h2><div class="row">${NATIVE.map((n,k)=>`<button class="lgb ${D.lang===k?'':'g'}" onclick="setLang(${k})"><span>${FLAG[k]}</span><small>${n}</small></button>`).join('')}</div></div>
    <button class="g w sb" onclick="onbOpen()">${IC.star(20)}${t('obT')}</button>`;
  }else if(view==='pal'){
    const cur=D.pal||'violet';
    a.innerHTML=`<div class="bar0">${bk('home',t('back'))}</div><h1 style="display:flex;align-items:center;gap:10px">${IC.pal(34)}${t('palT')}</h1><p class="mute">${t('palDesc')}</p>
    <div class="pals">${PAL.map(p=>{const m=TH==='dark'?p.d:p.l;return `<button class="pal ${cur===p.k?'on':''}" onclick="setPal('${p.k}')"><span class="sw"><i style="background:${m.bg}"></i><i style="background:${m.card}"></i><i style="background:${m.acc}"></i></span><b>${t('pal_'+p.k)}</b><em>${cur===p.k?'✓':''}</em></button>`}).join('')}</div>`;
  }else if(view==='ach'){
    const got=Object.keys(D.ach).length;
    a.innerHTML=`<div class="bar0">${bk('home',t('back'))}</div><h1 style="display:flex;align-items:center;gap:10px">${IC.trophy(34)}${t('achT')}</h1><p class="mute">${t('achOpen')}: ${got}/${ACH.length}</p>
    <div class="achs">${ACH.map(([k])=>{const on=!!D.ach[k];return `<div class="ach ${on?'on':''}"><div class="bdg">${ACHI[k](44)}</div><b>${t('a_'+k)}</b><small>${t('ad_'+k)}</small>${on?`<em>${D.ach[k]}</em>`:''}</div>`}).join('')}</div>`;
  }else if(view==='goal'){
    const st=D.st,done=Math.min(st.n,D.goal),C=439.8;
    a.innerHTML=`<div class="bar0">${bk('home',t('back'))}</div><h1 style="display:flex;align-items:center;gap:10px">${IC.target(34)}${t('goalT')}</h1><p class="mute">${t('goalDesc')}</p>
    <div class="ringw"><svg viewBox="0 0 180 180" width="210" height="210"><circle cx="90" cy="90" r="70" fill="none" stroke="var(--line)" stroke-width="14"/><circle id="ring" cx="90" cy="90" r="70" fill="none" stroke="var(--go)" stroke-width="14" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C}" transform="rotate(-90 90 90)" style="transition:stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1)"/><text x="90" y="100" text-anchor="middle" font-size="34" font-weight="800" fill="var(--ink)">${done}/${D.goal}</text></svg></div>
    <p class="mute" style="text-align:center;min-height:20px">${st.doneToday?'✓ '+t('goalDone'):''}</p>
    <div class="box"><div class="stp"><button class="g" onclick="setGoal(D.goal-5)">−5</button><b>${D.goal}</b><button class="g" onclick="setGoal(D.goal+5)">+5</button></div>
    <div class="row" style="margin-top:12px">${[10,20,30,50].map(n=>`<button class="g" onclick="setGoal(${n})" ${D.goal===n?'disabled':''}>${n}</button>`).join('')}</div></div>`;
    setTimeout(()=>{const r=$('#ring');if(r)r.style.strokeDashoffset=String(C*(1-done/D.goal))},60);
  }else{
    if(!q.length){if(ses&&!ses.ck){ses.ck=1;sfx('done');if(ses.n>=10&&ses.bad===0){D.perf=1;chkAch()}}a.innerHTML=conf()+`<div class="done"><h1>${t('done')}</h1><p class="mute">${t('doneP')}</p><button class="w" onclick="go(back)">${t('backBtn')}</button></div>`;return}
    const it=q[0],c=D.cats[it.c],d=c.decks[it.d],x=d.cards[it.i];
    if(x.o){a.innerHTML=quizHTML(c,d,x);return}
    a.innerHTML=`<div style="--c:${col(d)}"><div class="sbar"><button class="g x" onclick="go(back)" aria-label="${t('finish')}">✕</button><div class="bar"><i style="width:${(total-q.length)/total*100}%"></i></div><span class="mute">${q.length}</span></div>
    <div class="scene" onclick="flipC()"><div class="mover" id="mv"><div class="card" id="cd"><div class="face front">${canSpk(d)?`<button class="spk" onclick="event.stopPropagation();speakCur()" aria-label="Speak">${IC.spk(22)}</button>`:''}<small>${esc(cn(c))} · ${esc(dn(d))}</small>${x.p?`<div class="zh">${esc(x.f)}</div><div class="py">${esc(x.p)}</div>`:esc(x.f)}<em>${t('tapSee')}</em></div><div class="face back"><small>${t('ans')}</small>${x.p?`<div class="zh">${esc(x.f)}</div><div class="py">${esc(x.p)}</div>`:''}${esc(x.b)}</div></div></div></div>
    <div class="ans" id="ans"><button class="no" onclick="answer(false)">${t('no')}</button><button onclick="answer(true)">${t('yes')}</button></div></div>`;
  }
}
const _render0=render;render=function(){_render0();fitOpts()};
applyPal();chkAch(true);
if(!D.onb){view='onb';onbI=0}
save();render();enter();
if(D.st.lostMsg){D.st.lostMsg=false;save();toast(t('lostMsg'))}
</script></body></html>
