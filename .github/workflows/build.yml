name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 18

    - name: Install Cordova globally
      run: npm install -g cordova

    - name: Create Cordova Project
      run: |
        cordova create myApp com.example.app MyApp
        cd myApp
        cordova platform add android
        rm -rf www/*
        cp -r ../* www/ || true
        # Автоматически переименовываем твой файл в index.html для сборщика
        cd www
        mv "kartochki34 (2).html" index.html
        cd ..
        rm -rf www/.github www/myApp
        cordova build android --release
    
    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: myApp/platforms/android/app/build/outputs/apk/release/*.apk
